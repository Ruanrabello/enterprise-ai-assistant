<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Enterprise AI Assistant</title>
  <desc id="description">Plataforma corporativa de inteligência artificial com React, FastAPI e PostgreSQL</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061321"/>
      <stop offset="0.52" stop-color="#102c55"/>
      <stop offset="1" stop-color="#351662"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#b7d8ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1040" cy="82" r="150" fill="#22d3ee" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1110" cy="302" r="190" fill="#a855f7" fill-opacity="0.17" filter="url(#glow)"/>

  <path d="M850 286C945 184 1040 168 1180 74" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M887 316C982 235 1074 215 1200 157" fill="none" stroke="#22d3ee" stroke-opacity="0.18"/>
  <circle cx="935" cy="228" r="7" fill="#22d3ee"/>
  <circle cx="1026" cy="177" r="7" fill="#4f8cff"/>
  <circle cx="1113" cy="121" r="7" fill="#a855f7"/>

  <rect x="72" y="66" width="86" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">ENTERPRISE AI</text>
  <text x="72" y="215" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">ASSISTANT</text>
  <text x="75" y="266" fill="#c1d2ef" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="2.2">REACT  •  FASTAPI  •  POSTGRESQL  •  MULTI-PROVIDER AI</text>
  <rect x="74" y="304" width="590" height="2" rx="1" fill="url(#accent)" opacity="0.85"/>
</svg>
